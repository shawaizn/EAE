name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache key covers all React source files — cache hits skip the build entirely
      - name: Restore React build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/app
          key: react-${{ hashFiles('src/**', 'public/**', 'index.html', 'package-lock.json', 'vite.config.ts') }}

      - name: Setup Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build React app
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Move build to dist/app
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist/app
          mv dist/index.html dist/app/index.html
          [ -d dist/assets ] && mv dist/assets dist/app/assets

      - name: Assemble final site
        run: |
          mkdir -p dist
          cp landing/index.html dist/index.html
          cp landing/shawaiz.jpg dist/shawaiz.jpg
          cp dist/app/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
