name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Cache key covers React source AND landing page — any change triggers a rebuild
      - name: Restore build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            dist/app
            hostinger
          key: build-${{ hashFiles('src/**', 'public/**', 'index.html', 'package-lock.json', 'vite.config.ts', 'landing/**') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      # --- GitHub Pages build (base: /EAE/app/) ---
      - name: Build React app for GitHub Pages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Move build to dist/app
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist/app
          mv dist/index.html dist/app/index.html
          [ -d dist/assets ] && mv dist/assets dist/app/assets

      # --- Hostinger build (base: /app/) ---
      - name: Build React app for Hostinger
        if: steps.cache.outputs.cache-hit != 'true'
        run: BASE_URL=/app/ VITE_BASENAME=/app npm run build

      - name: Assemble Hostinger build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf hostinger
          mkdir -p hostinger/app

          # React app files
          mv dist/index.html hostinger/app/index.html
          [ -d dist/assets ] && mv dist/assets hostinger/app/assets

          # Landing page with paths rewritten for root-served domain
          sed 's|/EAE/app/|/app/|g' landing/index.html > hostinger/index.html

          # Copy landing page images
          for img in landing/*.jpg landing/*.png landing/*.webp landing/*.svg; do
            [ -f "$img" ] && cp "$img" hostinger/
          done

          # .htaccess so Apache rewrites /app/* back to the SPA index
          cat > hostinger/app/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /app/
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /app/index.html [L]
          </IfModule>
          EOF

      # --- Commit Hostinger build back to main ---
      - name: Commit Hostinger build to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hostinger/
          git diff --staged --quiet || git commit -m "chore: update hostinger build [skip ci]"
          git push origin main

      # --- Assemble and deploy GitHub Pages ---
      - name: Assemble final site
        run: |
          mkdir -p dist
          cp landing/index.html dist/index.html
          for img in landing/*.jpg landing/*.png landing/*.webp landing/*.svg; do
            [ -f "$img" ] && cp "$img" dist/
          done
          cp dist/app/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
