name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Cache covers React source + landing — any change triggers a rebuild
      - name: Restore build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/app
          key: build-${{ hashFiles('src/**', 'public/**', 'index.html', 'package-lock.json', 'vite.config.ts', 'landing/**') }}

      - name: Setup Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      # --- Build for GitHub Pages (base: /EAE/app/) ---
      - name: Build React app for GitHub Pages
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Move GitHub Pages build to dist/app
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist/app
          mv dist/index.html dist/app/index.html
          [ -d dist/assets ] && mv dist/assets dist/app/assets

      # --- Build for Hostinger (base: /app/) and commit to main ---
      - name: Build React app for Hostinger
        if: steps.cache.outputs.cache-hit != 'true'
        run: BASE_URL=/app/ VITE_BASENAME=/app npm run build

      - name: Commit Hostinger build to main
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Move built files into app/ at repo root
          rm -rf app
          mkdir -p app
          mv dist/index.html app/index.html
          [ -d dist/assets ] && mv dist/assets app/assets

          # Copy landing page images to repo root so relative URLs resolve correctly
          for img in landing/*.jpg landing/*.png landing/*.webp landing/*.svg; do
            [ -f "$img" ] && cp "$img" "$(basename $img)"
          done

          # .htaccess: route / to landing page, route /app/* to the SPA
          cat > .htaccess << 'HTEOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Serve landing page transparently at the domain root
            RewriteRule ^$ landing/index.html [L]
            RewriteRule ^index\.html$ landing/index.html [L]

            # SPA routing — all /app/* paths go to the React entry point
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^app/(.*)$ app/index.html [L]
          </IfModule>
          HTEOF

          # Commit everything back to main so Hostinger picks it up
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ .htaccess *.jpg *.png *.webp *.svg 2>/dev/null || true
          git rm -r --cached hostinger/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update hostinger build [skip ci]"
          git push origin main

      # --- Assemble and deploy to GitHub Pages ---
      - name: Assemble final GitHub Pages site
        run: |
          mkdir -p dist
          cp landing/index.html dist/index.html
          for img in landing/*.jpg landing/*.png landing/*.webp landing/*.svg; do
            [ -f "$img" ] && cp "$img" dist/
          done
          cp dist/app/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
